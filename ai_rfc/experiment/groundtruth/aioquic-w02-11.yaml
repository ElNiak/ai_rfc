# Ground truth for the aioquic w02-11 window, HTTP/3 scope.
#
# Every entry is anchored twice: `source` names a file and a line in the pinned
# checkout, and that line spells exactly `symbol = value`. Both are checked by
# tests/experiment/test_ground_truth.py, so an entry cannot drift silently.
#
# `value` and `section` are quoted deliberately; `symbol` is a bareword on every
# entry. YAML reads a bare 0x100 as the integer 256 and a bare 8.10 as the float
# 8.1. The isinstance guards in tests/experiment/test_ground_truth.py are what
# hold all three fields to text, and they are what reports a coercion in the
# field that was coerced: an int value would still fail the anchor, but as a
# line mismatch that reads like a wrong citation, and a float section compared
# as str(8.1) would match the citation pattern outright, silently moving the
# citation to Section 8.1.
#
# Scope: src/aioquic/h3/ only. Members whose specification is a WebTransport
# draft (FrameType.WEBTRANSPORT_STREAM, Setting.ENABLE_WEBTRANSPORT,
# StreamType.WEBTRANSPORT) and FrameType.DUPLICATE_PUSH, which no published RFC
# registers, are omitted rather than cited to a document that was not read.
#
# Which section to cite: the section that normatively defines the value, not
# the IANA registry that records it. Cite a registry section only where the
# document establishes the value nowhere else, or where the statement is
# itself a claim about registration.
#
# Exactly three citations here are registry sections, and each is one of those
# two exceptions, so do not "fix" them. h3-const-reserved-settings cites
# RFC 9114 Section 11.2.2 and h3-frame-priority-reserved cites Section 11.2.1
# because each statement is a claim about what RFC 9114 registers; Table 3 in
# Section 11.2.2 is also the only place all five reserved setting identifiers
# appear together, and Section 7.2.4.1 does not reach 0x0, which Appendix A.3
# shows was never an HTTP/2 setting. h3-error-datagram-error cites RFC 9297
# Section 5.2 because RFC 9297 gives the code's meaning only in that registry
# entry; Sections 2 and 2.1 invoke H3_DATAGRAM_ERROR (0x33) in error rules
# without saying what it signals.
#
# Provenance of the RFC mapping, which no test here checks: on 2026-09-18 all
# 41 entries were checked against RFC 9114, 9204, 9220 and 9297 fetched from
# rfc-editor.org, by confirming that each entry's value is supported by the
# body of the section it cites. The 39 entries whose value is numeric were
# checked mechanically, by comparing integers rather than text -- the RFC
# writes 0x0100 where aioquic writes 0x100, so a text comparison would have
# reported every error code as a miss. The 2 entries whose value is not
# numeric, h3-const-alpn and h3-const-reserved-settings, were checked by
# reading the cited section, and for those two "supported by" is weaker than
# "appears in": Section 3.2 of RFC 9114 carries the token "h3", not the literal
# ["h3"], and Section 11.2.2 carries the five reserved identifiers as separate
# Table 3 rows, not as the tuple (0x0, 0x2, 0x3, 0x4, 0x5).
#
# Six entries had their citation corrected later that day, and those two are
# among the six, so the union is six entries and not eight. The other four are
# numeric, which means their mechanical result pertains to the citation the
# correction superseded; only the re-read of the corrected section covers them.
# What all of this establishes is that the value is supported by the cited
# section. It does not establish that the cited section is the best support
# for the statement, and no test in this repository can decide either
# question.

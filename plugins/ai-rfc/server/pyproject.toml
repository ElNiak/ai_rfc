[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rfc-server"
version = "0.1.0"
description = "MCP server and parity CLI driving the PANTHER a_rfc reconstruction substrate"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
tests = ["pytest>=8"]

[project.scripts]
arfc = "ai_rfc_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
